# Production runs against managed Postgres (RDS), set via DATABASE_URL in
# .env.prod. There is deliberately no `db` service here: one used to run
# alongside, serving nothing, and having two databases on the box caused real
# damage — migrations were applied to the wrong one, a seed run landed in it
# instead of production, and its volume consumed disk on a host that has hit
# ENOSPC during builds.
#
# The pgvector tables it held (legal_document_chunks, llm_groundings) belong to
# apps/ml-service, which only runs in the dev compose file. Restore a pgvector
# service here if that service is ever deployed to production.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      # Stamps the running image so admin System Status can answer "is this
      # actually my code?" — a stale API image has been mistaken for a code bug
      # more than once. Empty when unset, which the page reports as unknown.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: clearcaseiq-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      # Required, not defaulted. This previously fell back to a local db
      # container, so losing the variable silently pointed the API at an empty
      # database instead of failing — the same quiet-failure pattern that let a
      # schema mismatch run unnoticed for three days.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (managed Postgres connection string)}
      API_URL: https://api.clearcaseiq.com
      WEB_URL: https://www.clearcaseiq.com
      CORS_ORIGINS: https://www.clearcaseiq.com,https://clearcaseiq.com
      TRUST_PROXY: "1"
      FILE_BUCKET: ${FILE_BUCKET:-s3}
      OCR_PROVIDER: aws_textract
      ENABLE_OCR: "true"
      PDF_TEXTRACT_FALLBACK: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - api_uploads:/app/uploads
    expose:
      - "4000"
    # /health/ready runs real queries, so an API serving 500s on every case
    # route shows up as unhealthy here instead of looking fine. Uses node
    # rather than curl/wget, which the slim runtime image does not carry.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:4000/health/ready',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clearcaseiq

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.clearcaseiq.com
        # SEO and analytics. Read from the deploy environment or a root .env so
        # the measurement and verification ids are not committed. Each is
        # optional; an unset value just omits that tag from the built pages.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.clearcaseiq.com}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: clearcaseiq-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://api.clearcaseiq.com
    depends_on:
      - api
    expose:
      - "3000"
    # Catches the "sh: next: not found" class of failure, where the container
    # exists but never serves.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000/',
          r => process.exit(r.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - clearcaseiq

  nginx:
    image: nginx:1.27-alpine
    container_name: clearcaseiq-nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/clearcaseiq.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - clearcaseiq

volumes:
  api_uploads:

networks:
  clearcaseiq:
    driver: bridge
