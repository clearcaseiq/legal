name: Pipeline

# test -> build -> deploy QA -> approve -> deploy production.
#
# This replaces ci.yml and images.yml, which both triggered on push to main and
# ran independently. Nothing connected them, so a commit that failed the test
# suite was still built and published to ECR, ready to deploy. The test gate
# existed and gated nothing. `needs:` is the whole fix.
#
# Promotion is not a rebuild. Production deploys the identical image QA already
# ran, identified by commit SHA, so "it worked in QA" is a statement about the
# artifact rather than about a second build of the same source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deliberately no workflow-level concurrency. It was here, and combined with the
# approval gate it deadlocked the pipeline: a run parked waiting for someone to
# approve production holds the group, so every later push queues behind it and no
# tests run until a human acts. Blocking CI feedback on an unrelated approval is
# worse than the problem it solved.
#
# Cancellation is what has to be avoided, not overlap. Cancelling mid-build
# leaves one image pushed and the other not, under a tag that still looks
# deployable - that happened, and produced a web image with no matching API. Two
# builds running at once is merely wasteful. So builds are left to overlap, and
# only the deploy jobs serialise, on their own groups below.

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. Setting one alongside the `packageManager`
      # field in package.json makes action-setup@v4 abort with "Multiple versions
      # of pnpm specified", which is why every CI run failed within ten seconds.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated from schema.prisma and is not committed,
      # so the typecheck inside `pnpm build` cannot resolve model types without
      # this. It also means a schema change that breaks a query fails here.
      - name: Generate Prisma client
        run: pnpm --filter caseiq-api prisma:generate

      - name: Build
        run: pnpm build

      # Scoped to the API rather than the root `pnpm test`, which also shells out
      # to a Python suite this runner has no interpreter for. Widen it once the
      # web and Python suites are green in CI.
      - name: Test (API)
        # env.ts requires these two at import time and there is no .env on a
        # runner. Nothing here connects to a database - the suite runs against a
        # mocked Prisma client - so the URL only has to parse. NODE_ENV=test also
        # keeps the production boot guards (email provider, placeholder secrets)
        # from failing a run that has no real configuration.
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-not-a-real-secret
        run: pnpm --filter caseiq-api test

  build:
    name: Build images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      # Keep going if one image fails: a red api build should not hide whether
      # web also broke, which matters when the cause is a shared dependency.
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: api/Dockerfile
            repository: clearcaseiq-api
          - service: web
            dockerfile: app/Dockerfile
            repository: clearcaseiq-web

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Assumed via OIDC, so there are no long-lived AWS keys in GitHub
          # secrets to leak or rotate. The trust policy restricts
          # token.actions.githubusercontent.com to this repository.
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Stamp build time
        id: stamp
        # Matches the format the manual build on the host used, since the admin
        # System Status page renders this value as-is.
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.ref_name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.value }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_BING_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
          # Layer cache in the registry rather than on the runner, which starts
          # empty every run. Without it each build reinstalls the whole pnpm
          # workspace.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:buildcache,mode=max

  deploy-qa:
    name: Deploy to QA
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy per host at a time. Two rollouts interleaving on the same box
    # would race over the env file and the running containers.
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    environment:
      name: qa
      url: https://qa.clearcaseiq.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        uses: ./.github/actions/ssm-deploy
        with:
          # INSTANCE_ID is the older single-host variable, kept as a fallback so
          # an environment that has not been renamed still deploys rather than
          # failing on an empty input.
          instance-ids: ${{ vars.INSTANCE_IDS || vars.INSTANCE_ID }}
          app-dir: ${{ vars.APP_DIR }}
          environment: qa
          tag: ${{ github.sha }}

  # The approval wait and the rollout are separate jobs on purpose.
  #
  # A job holds its concurrency group from the moment it is queued, and that
  # includes the entire time it sits waiting for a reviewer. With the gate and
  # the group on one job, a run parked at the approval blocked every later run
  # from reaching its own gate: the newer run sat in `pending` with nothing to
  # approve, and the only way to clear it was to cancel the older run. This is
  # the same deadlock the workflow-level concurrency above was removed for,
  # reproduced between two runs rather than across the whole pipeline.
  #
  # So the gate carries the environment, and therefore the required reviewer,
  # but no group - waiting here blocks nothing.
  approve-production:
    name: Approve production
    needs: deploy-qa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.clearcaseiq.com
    # Passed through as outputs because the rollout below runs in its own
    # environment and so cannot read this one's variables. These are variables,
    # not secrets, so they survive the hop - a secret would arrive redacted.
    # AWS_DEPLOY_ROLE_ARN is repo-scoped and read directly on both sides.
    outputs:
      instance-ids: ${{ steps.targets.outputs.instance-ids }}
      app-dir: ${{ steps.targets.outputs.app-dir }}
      target-group-arn: ${{ steps.targets.outputs.target-group-arn }}
    steps:
      - name: Resolve production targets
        id: targets
        run: |
          {
            echo "instance-ids=${{ vars.INSTANCE_IDS || vars.INSTANCE_ID }}"
            echo "app-dir=${{ vars.APP_DIR }}"
            echo "target-group-arn=${{ vars.TARGET_GROUP_ARN }}"
          } >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to production
    needs: approve-production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The deploy role's trust policy accepts only an environment-scoped OIDC
    # subject, so a job declaring no environment cannot assume it whatever the
    # role ARN says. Splitting the approval wait out of this job dropped the
    # `environment:` along with it, and every production rollout from then on
    # failed at "Configure AWS credentials" with "Not authorized to perform
    # sts:AssumeRoleWithWebIdentity" - a permissions error, so it did not read
    # as a consequence of moving a concurrency group.
    #
    # This is a second environment rather than `production` because naming
    # `production` here would make the gate above run twice: every job that
    # references an environment with a required reviewer waits for its own
    # approval, and this one holds the concurrency group while it waits, which
    # is the deadlock the split was written to fix. So it carries no reviewer -
    # `needs: approve-production` is what keeps it behind the gate - and it is
    # restricted to `main`, so a workflow on a branch cannot name it to reach a
    # host.
    environment:
      name: production-rollout
      url: https://www.clearcaseiq.com
    # One rollout per host at a time, as with QA. Now that the approval wait sits
    # in the job above, this group is only held while a deploy is actually
    # running, which is the thing that must not overlap.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        uses: ./.github/actions/ssm-deploy
        with:
          instance-ids: ${{ needs.approve-production.outputs.instance-ids }}
          app-dir: ${{ needs.approve-production.outputs.app-dir }}
          environment: prod
          tag: ${{ github.sha }}
          # Present so each host is pulled out of the load balancer before its
          # own containers restart. With it unset the rollout still works, but
          # the ALB needs three failed checks to notice a host is down, so every
          # deploy would serve 502s for around 45 seconds.
          target-group-arn: ${{ needs.approve-production.outputs.target-group-arn }}
