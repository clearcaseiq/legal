# QA. Mounted as default.conf by docker-compose.deploy.yml when DEPLOY_ENV=qa.
# Identical to prod.conf apart from server names and the certificate path;
# routing rules are shared through proxy-common.conf so they cannot drift.
#
# There is no apex redirect block here — QA has no apex domain — and no
# separate api host. QA reaches the API same-origin under /v1 like the browser
# does, which means one fewer certificate name and one fewer DNS record.

server {
  listen 80;
  server_name qa.clearcaseiq.com api-qa.clearcaseiq.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name qa.clearcaseiq.com;

  ssl_certificate /etc/letsencrypt/live/qa.clearcaseiq.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/qa.clearcaseiq.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 50m;

  location /v1/ {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /_next/static/ {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}

# The OAuth providers are registered against a hostname, and several of them
# (Apple, Zoom) will not accept a path-only difference, so QA still needs an
# api- host for callbacks even though the browser uses same-origin /v1.
server {
  listen 443 ssl http2;
  server_name api-qa.clearcaseiq.com;

  ssl_certificate /etc/letsencrypt/live/qa.clearcaseiq.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/qa.clearcaseiq.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 50m;

  location / {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }
}
