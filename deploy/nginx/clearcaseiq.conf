# Local compose only (docker-compose.yml). The deployed environments use
# prod.conf and qa.conf, which share their proxy rules through
# proxy-common.conf; this file is not in that set and does not need to track it.

server {
  listen 80;
  server_name clearcaseiq.com www.clearcaseiq.com api.clearcaseiq.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name clearcaseiq.com;

  ssl_certificate /etc/letsencrypt/live/clearcaseiq.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clearcaseiq.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://www.clearcaseiq.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.clearcaseiq.com;

  ssl_certificate /etc/letsencrypt/live/clearcaseiq.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clearcaseiq.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 50m;

  # The web bundle carries no API hostname (see app/Dockerfile), so the browser
  # calls /v1 and /uploads on whatever host it is already on. Without these
  # locations those requests fall through to Next.js, whose rewrite forwards to
  # 127.0.0.1:4000 — which inside the web container is the web container, not
  # the API. Matched ahead of the catch-all for that reason.
  location /v1/ {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  # Hashed build assets are content-addressed (the filename changes when the
  # content changes), so they are safe to cache forever. Matched before the
  # catch-all below so they keep Next.js's long-lived immutable caching.
  location /_next/static/ {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # The HTML document references the current build's hashed chunk names. If a
    # browser (or intermediate cache) serves a stale document, it pulls old
    # chunk names and the user sees an old build even after a fresh deploy.
    # Force revalidation of the document on every load so new builds appear
    # immediately; the immutable chunks above are still cached aggressively.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}

server {
  listen 443 ssl http2;
  server_name api.clearcaseiq.com;

  ssl_certificate /etc/letsencrypt/live/clearcaseiq.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clearcaseiq.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 50m;

  location / {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
