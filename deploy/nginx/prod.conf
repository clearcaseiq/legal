# Production, behind the Application Load Balancer. Mounted as default.conf by
# docker-compose.deploy.yml when DEPLOY_ENV=prod.
#
# TLS terminates at the ALB using an ACM certificate, so nginx serves plain HTTP
# on 80 and holds no key material. That is the point of the move: the previous
# setup obtained certificates with `certbot --standalone`, which needs ports 80
# and 443 free, and nginx holds both - so renewal would have failed silently and
# the site would have gone dark roughly 90 days after issue. ACM renews itself
# with no host involvement, which removes the failure mode rather than patching
# it.
#
# This is why prod.conf and qa.conf no longer mirror each other. QA still
# terminates TLS itself with Let's Encrypt and still carries that renewal
# problem; it needs the same treatment.
#
# The redirects that used to live here moved outward. The ALB listener on 80
# redirects to 443, so nginx must NOT redirect http to https - traffic arrives
# here already decrypted on port 80, and redirecting it would bounce the client
# back through the ALB into an infinite loop.
#
# proxy-common.conf sets X-Forwarded-Proto to a hardcoded https, which stays
# correct: every public request reaches the ALB over TLS regardless of what the
# hop into this container looks like.

# ALB health checks are addressed to the target's IP rather than a hostname, so
# they match no server_name and land in this default block. Keeping it separate
# means a health check can never be answered by an application server block that
# happens to be misrouted.
server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}

server {
  listen 80;
  server_name clearcaseiq.com;

  # Hardcoded https rather than $scheme, which is http on this hop.
  return 301 https://www.clearcaseiq.com$request_uri;
}

server {
  listen 80;
  server_name www.clearcaseiq.com;

  client_max_body_size 50m;

  # The browser reaches the API same-origin, so the web image carries no API
  # hostname and one image serves every environment. Matched ahead of the
  # catch-all so these never reach Next.js, which would 404 them in production.
  #
  # Proxied straight to the API rather than through the Next rewrite that
  # handles the same paths in local dev: that rewrite would put every API
  # response through the Node web process for no benefit.
  location /v1/ {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  # Hashed build assets are content-addressed (the filename changes when the
  # content changes), so they are safe to cache forever. Matched before the
  # catch-all below so they keep Next.js's long-lived immutable caching.
  location /_next/static/ {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # The HTML document references the current build's hashed chunk names. If a
    # browser (or intermediate cache) serves a stale document, it pulls old
    # chunk names and the user sees an old build even after a fresh deploy.
    # Force revalidation of the document on every load so new builds appear
    # immediately; the immutable chunks above are still cached aggressively.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    # Tell the browser to upgrade any http:// subresource request on the page to
    # https:// automatically. A single passive-mixed-content resource (an image,
    # font, etc.) downgrades the whole page to "Not secure" even with a valid
    # cert; this eliminates that class of warning site-wide regardless of source.
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
  }
}

server {
  listen 80;
  server_name api.clearcaseiq.com;

  client_max_body_size 50m;

  location / {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/proxy-common.conf;
  }
}
