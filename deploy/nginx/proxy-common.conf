# Shared proxy headers, included by every location in both environments.
#
# These were previously copy-pasted into five location blocks in a single
# production config. With a second environment that would have become ten, and
# the failure mode of the copies drifting is quiet: X-Forwarded-Proto going
# missing on one block makes the API generate http:// callback URLs for that
# path only, which looks like a broken OAuth provider rather than a proxy bug.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Hardcoded rather than $scheme: nginx terminates TLS here and proxies onward in
# cleartext, so $scheme would say http and TRUST_PROXY would hand the API the
# wrong protocol for every generated link.
proxy_set_header X-Forwarded-Proto https;
