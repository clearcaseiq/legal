# One deploy file for every environment. Which environment it is comes entirely
# from the --env-file you pass:
#
#   docker compose -f docker-compose.deploy.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.deploy.yml --env-file .env.qa   up -d
#
# This replaces docker-compose.prod.yml, which hardcoded the production
# hostnames in its `environment:` and `args:` blocks. Compose gives those
# precedence over `env_file:`, so a second environment pointed at its own env
# file would still have come up talking to production — the failure would have
# been invisible until QA wrote to the production database.
#
# The rule that keeps that from coming back: nothing in this file names an
# environment. Every value that differs between QA and production is read from
# the env file, and the ones that would be dangerous to default are declared
# `:?` so a missing value stops the stack instead of guessing.
#
# Production runs against managed Postgres (RDS), set via DATABASE_URL. There is
# deliberately no `db` service here: one used to run alongside, serving nothing,
# and having two databases on the box caused real damage — migrations were
# applied to the wrong one, a seed run landed in it instead of production, and
# its volume consumed disk on a host that has hit ENOSPC during builds.
#
# The pgvector tables it held (legal_document_chunks, llm_groundings) belong to
# apps/ml-service, which only runs in the dev compose file. Restore a pgvector
# service here if that service is ever deployed.
# Bounded logs, applied to every service below.
#
# Docker's json-file driver defaults to unlimited size. The API logs every
# request through morgan and runs a sweep every 15 seconds, and container logs
# are the only diagnostic surface this deployment has — so left uncapped they
# fill the disk on a host that has already hit ENOSPC, and they do it at the
# moment you most need them. 50 MB x 5 files bounds each service at 250 MB while
# still holding enough history to investigate an incident from the day before.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      # Stamps the running image so admin System Status can answer "is this
      # actually my code?" — a stale API image has been mistaken for a code bug
      # more than once. Empty when unset, which the page reports as unknown.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    # Required rather than defaulted. This fell back to `clearcaseiq-api:local`,
    # an image that exists only on a host that has built one itself - so a
    # deployment host missing the variable failed at pull time complaining about
    # a tag nobody set, instead of naming the variable that was absent.
    #
    # deploy/deploy.sh writes both this and WEB_IMAGE from a single tag. Set them
    # by hand only for a break-glass `docker compose build`, where any local
    # value will do.
    image: ${API_IMAGE:?API_IMAGE is required (deploy/deploy.sh sets it from the tag being deployed)}
    container_name: clearcaseiq-${DEPLOY_ENV:?DEPLOY_ENV is required (prod or qa)}-api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.${DEPLOY_ENV}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      # Both environments run with NODE_ENV=production, so the app had no way to
      # tell which one it was. That is fine until a setting is only wrong in one
      # of them — production was found running Stripe sandbox keys, and nothing
      # could detect it because the process could not tell prod from QA.
      DEPLOY_ENV: ${DEPLOY_ENV}
      # Required, not defaulted. This previously fell back to a local db
      # container, so losing the variable silently pointed the API at an empty
      # database instead of failing — the same quiet-failure pattern that let a
      # schema mismatch run unnoticed for three days.
      #
      # It matters more now than it did with a single environment: the API
      # entrypoint runs `prisma db push` on boot, so a QA box holding
      # production's URL would push schema changes into production.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (managed Postgres connection string)}
      # No defaults. A QA stack that quietly fell back to the production URLs
      # would mint password-reset and OAuth callback links pointing at
      # production, which is the exact class of bug this file exists to prevent.
      API_URL: ${API_URL:?API_URL is required (this environment's public API origin)}
      WEB_URL: ${WEB_URL:?WEB_URL is required (this environment's public web origin)}
      # The browser now reaches the API same-origin through nginx, so this only
      # covers non-browser and cross-origin clients (the extension, embeds).
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required (comma-separated origins)}
      TRUST_PROXY: "1"
      FILE_BUCKET: ${FILE_BUCKET:-s3}
      OCR_PROVIDER: aws_textract
      ENABLE_OCR: "true"
      PDF_TEXTRACT_FALLBACK: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - api_uploads:/app/uploads
    expose:
      - "4000"
    # /health/ready runs real queries, so an API serving 500s on every case
    # route shows up as unhealthy here instead of looking fine. Uses node
    # rather than curl/wget, which the slim runtime image does not carry.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:4000/health/ready',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clearcaseiq

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        # Deliberately no NEXT_PUBLIC_API_URL. Next inlines NEXT_PUBLIC_* at
        # build time, so passing it here would compile one environment's API
        # hostname into the bundle and make the image unpromotable. With it
        # unset, getApiOrigin() in app/src/lib/runtimeEnv.ts returns '' and the
        # browser calls /v1 on whatever host it is already on, which nginx
        # proxies to the api service. Same image everywhere, and no CORS.
        #
        # These are analytics and search-console tokens, which are genuinely
        # build-time and genuinely production-only. Left unset for QA, which
        # omits the tags entirely — the desired outcome there anyway.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: ${WEB_IMAGE:?WEB_IMAGE is required (deploy/deploy.sh sets it from the tag being deployed)}
    container_name: clearcaseiq-${DEPLOY_ENV}-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
      # Read at request time by robots.txt, sitemap.xml and the canonical tags,
      # all of which are server-rendered. Runtime rather than build-time is what
      # lets one image serve both hosts without advertising the wrong domain.
      SITE_URL: ${SITE_URL:?SITE_URL is required (this environment's public web origin)}
      # Fallback target for the /v1, /uploads and /health rewrites in
      # next.config.mjs. nginx normally matches those first, so this only
      # applies if something reaches Next directly; without it the rewrite would
      # point at 127.0.0.1 inside the web container, which is the web container.
      API_PROXY_ORIGIN: http://api:4000
      # QA must never be indexable — it serves the same pages as production
      # and would compete with the real site for its own queries. `.env.qa`
      # carries the `disabled` that does that.
      #
      # The default here has to be `enabled`, and the direction is not
      # arbitrary. This defaulted to `disabled`, which meant production — whose
      # env file never set the variable, because it is the environment the
      # default is supposed to describe — served `Disallow: /` and rendered
      # every page `noindex`. An unset variable has to mean "the public site",
      # since that is the deployment nobody remembers to configure. Forgetting
      # it on QA leaves QA crawlable, which is recoverable; getting it wrong in
      # this direction delists the live site.
      SEARCH_ENGINE_INDEXING: ${SEARCH_ENGINE_INDEXING:-enabled}
    depends_on:
      - api
    expose:
      - "3000"
    # Catches the "sh: next: not found" class of failure, where the container
    # exists but never serves.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000/',
          r => process.exit(r.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - clearcaseiq

  nginx:
    image: nginx:1.27-alpine
    container_name: clearcaseiq-${DEPLOY_ENV}-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Per-environment server names and certificate paths. The proxy rules
      # themselves are shared via an include, so a routing change cannot land in
      # one environment and not the other.
      - ./deploy/nginx/${DEPLOY_ENV}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - clearcaseiq

volumes:
  api_uploads:

networks:
  clearcaseiq:
    driver: bridge
