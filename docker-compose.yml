services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    container_name: injury-intelligence-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: injury_intelligence
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./apps/ml-service/sql/init_pgvector.sql:/docker-entrypoint-initdb.d/010-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d injury_intelligence"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - injury-network

  # API Backend
  #
  # api/Dockerfile is a workspace-aware production build: it COPYs from the repo
  # root (root package.json/lockfile, api/package.json, api/) and runs the built
  # `node dist/index.js` via docker-entrypoint.sh. The build context must be the
  # repo root, not ./api, or the `COPY api ./api` step fails with "/api: not
  # found". We also intentionally do NOT mount ./api or an empty node_modules
  # volume: doing so would shadow the built /app/dist and break the runtime.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: injury-intelligence-api
    ports:
      - "4000:4000"
    # The production image does not bundle api/.env (dotenv previously read it via
    # the removed source mount), so inject it here to supply runtime secrets, LLM
    # API keys, JWT secret, CORS_ORIGINS, etc. Values in `environment:` below win
    # over env_file, so infra wiring (DB host, ML URL) stays authoritative.
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/injury_intelligence?schema=public
      NODE_ENV: development
      PORT: 4000
      FILE_BUCKET: local
      ML_SERVICE_URL: http://ml:8000
      ML_PREDICTION_MODE: shadow
      ML_RETRIEVAL_ENABLED: "true"
      ML_RETRIEVAL_TOP_K: 4
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    volumes:
      # Persist uploaded evidence/scene files across container rebuilds. The
      # runner serves them from /app/uploads.
      - ./uploads:/app/uploads
    networks:
      - injury-network

  # Python ML service
  ml:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: injury-intelligence-ml
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/injury_intelligence
      MLFLOW_TRACKING_URI: http://mlflow:5001
      PREDICTIVE_MODEL_VERSION: shadow-v1
      LEGAL_CORPUS_JSONL: /app/artifacts/corpus/legal_corpus.jsonl
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/ml-service/src:/app/src
      - ./apps/ml-service/pipelines:/app/pipelines
      - ./apps/ml-service/sql:/app/sql
      - ./artifacts/ml:/app/artifacts
    networks:
      - injury-network

  # Local experiment tracking and model registry
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: injury-intelligence-mlflow
    ports:
      - "5001:5001"
    command: mlflow server --host 0.0.0.0 --port 5001 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    volumes:
      - ./artifacts/mlflow:/mlflow
    networks:
      - injury-network

  # Web Frontend
  #
  # Runs the production standalone build baked by app/Dockerfile (node app/server.js).
  # We intentionally do NOT mount ./app or an empty node_modules volume here: the
  # Dockerfile produces a lean standalone bundle (to stay under the disk limit that
  # previously caused ENOSPC), so a dev-mode `pnpm dev` over a mounted source would
  # fail with "next: not found". The frontend talks to the API same-origin through
  # nginx (getApiOrigin() returns '' in production), so NEXT_PUBLIC_API_URL is not
  # required. For local hot-reload, run `pnpm dev` in ./app directly instead.
  web:
    build:
      # app/Dockerfile is a workspace-aware build: it COPYs from the repo root
      # (root package.json/lockfile, api/package.json, app/, and shared/). The
      # build context must therefore be the repo root, not ./app, or the COPY of
      # shared/ (and the root manifests) fails with "/shared: not found". This
      # matches how CI builds the image.
      context: .
      dockerfile: app/Dockerfile
      # Next inlines NEXT_PUBLIC_* at BUILD time, so the production API origin must
      # be baked in here (the app throws "NEXT_PUBLIC_API_URL is not configured"
      # otherwise). Override via a NEXT_PUBLIC_API_URL env/.env entry if needed.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.clearcaseiq.com}
    container_name: injury-intelligence-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    networks:
      - injury-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: clearcaseiq-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/clearcaseiq.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - injury-network

volumes:
  dbdata:

networks:
  injury-network:
    driver: bridge
